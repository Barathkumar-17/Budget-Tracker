# One-off, manually triggered check that the Docker setup works end to end.
# Not CI: it never runs on push or pull request.
name: docker-test

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build images and start the stack
        run: docker compose up -d --build

      - name: Wait for the API and the web app
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/docs > /dev/null && curl -sf http://localhost:3000/ > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8000/account
          echo
          curl -sfI http://localhost:3000/ | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Walk through every page in a real browser
        env:
          BASE_URL: http://localhost:3000/
          SHOTS: walkthrough-shots
          SLOW: "1.5"
        run: python e2e/walkthrough.py

      - name: Data survives an API container restart
        run: |
          docker compose restart api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/account > /dev/null && break; sleep 2; done
          python - <<'PY'
          import json, urllib.request
          acc = json.load(urllib.request.urlopen("http://localhost:8000/account"))
          print(acc)
          assert acc["balance"] == 190.0, acc
          PY

      - name: Reset, seed demo data and capture screenshots
        env:
          BASE_URL: http://localhost:3000/
          SHOTS: demo-shots
          SLOW: "1.5"
        run: |
          docker compose down -v
          docker compose up -d
          for i in $(seq 1 30); do curl -sf http://localhost:8000/account > /dev/null && break; sleep 2; done
          python backend/seed_demo.py
          python e2e/screenshots.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            walkthrough-shots
            demo-shots

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
