# Render Blueprint: New > Blueprint > pick this repo.
# One service builds the root Dockerfile and serves the web app and the API
# from the same URL. (A plain "Web Service" with default settings works too.)
services:
  - type: web
    name: budget-tracker
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true   # rebuild on every push to main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # Optional: with a password set here, the container also creates a review
      # account (user `review`) seeded with a known October 2026 on every start.
      - key: REVIEW_PASSWORD
        sync: false   # set the value in the Render dashboard, never in this file
