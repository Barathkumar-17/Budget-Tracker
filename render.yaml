# Render Blueprint: New > Blueprint > pick this repo.
# One service builds the root Dockerfile and serves the web app and the API
# from the same URL. (A plain "Web Service" with default settings works too.)
services:
  - type: web
    name: budget-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
