name: budget_tracker
description: Personal budget and expense tracker.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage-Regular.ttf
          weight: 400
        - asset: assets/fonts/Bricolage-Medium.ttf
          weight: 500
        - asset: assets/fonts/Bricolage-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Bricolage-Bold.ttf
          weight: 700
    - family: BricolageDisplay
      fonts:
        - asset: assets/fonts/BricolageDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageDisplay-ExtraBold.ttf
          weight: 800
    - family: SourceSerif
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
